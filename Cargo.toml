[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/birchamp/tc-rst"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Full debug info made each agent worktree's target dir several GB and filled the disk.
[profile.dev]
debug = "line-tables-only"

# The journal hashes every pack and line; unoptimized SHA-256 made its 64 MiB tests take
# minutes.
[profile.dev.package.sha2]
opt-level = 3

# Every `cargo test` generates the Psalms corpus and one ten times larger, and folds both,
# for the operation-count tests of docs/PERFORMANCE.md rule 2: about half a million changes.
# Unoptimized, that alone took minutes.
[profile.dev.package.tc-journal]
opt-level = 2

[profile.dev.package.tc-corpus]
opt-level = 2

[profile.dev.package.tc-usfm]
opt-level = 2
