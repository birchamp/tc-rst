[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/birchamp/tc-rst"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
proptest = "1"
tempfile = "3"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"

# Full debug info made each agent worktree's target dir several GB and filled the disk.
[profile.dev]
debug = "line-tables-only"
