[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway spikes have their own Cargo.toml and Cargo.lock and are never built
# with the workspace (spikes/electronite: the Electronite spike G0).
exclude = ["spikes"]

[workspace.package]
version = "4.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/birchamp/tc-rst"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
# INV-PROVEN-PANICS
unreachable = "warn"
# INV-EVERY-ALLOW-HAS-A-REASON
allow_attributes_without_reason = "warn"
# INV-NO-BAGS-OF-BOOLEANS
struct_excessive_bools = "warn"
# INV-NO-BAGS-OF-BOOLEANS
fn_params_excessive_bools = "warn"

# The UI's WebAssembly: smallest code, one unit, link-time optimisation.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1.13.1"
# Already in Cargo.lock through jsonschema; the version locked there. tc-helps ports tC4's
# JavaScript patterns, whose lookbehinds the regex crate does not have.
fancy-regex = "0.19.2"
proptest = "1"
proptest-derive = "0.9.0"
tempfile = "3"
# The parity gate (crates/tc-ui/tests/screen_record.rs) reads and draws screenshots.
png = "0.18.1"
axum = { version = "0.8.9", default-features = false }
base64 = "0.22.1"
# Already in Cargo.lock through axum and hyper; the versions locked there.
futures-util = { version = "0.3.34", default-features = false }
http-body = "1.1.0"
# Already in Cargo.lock through reqwest; the version locked there. tc-door43 reads the system's
# proxy settings with its matcher, as reqwest's own system proxy does.
hyper-util = { version = "0.1.21", default-features = false }
percent-encoding = "2.3.2"
# Windows only (tc-door43's WinHTTP proxy lookup; docs/evidence/proxy-watch-audit-2026-10-19.md).
# Pinned: before any upgrade, read the diff of src/pac/winhttp.rs, src/sys/win/ and build.rs,
# check that the version's crates.io trusted-publishing commit is on its main branch with CI
# green, and update the checksum in that record. Its MIT licence is the one taken; its notice is
# crates/tc-door43/NOTICE and ships with the app. Never run its own tests with
# --include-ignored: they rewrite the user's Internet Settings.
proxy-watch = { version = "=0.3.1", default-features = false }
subtle = "2.6.1"
md-5 = "0.11.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false }
# Already in Cargo.lock through rustls-webpki and quinn-proto; the version locked there.
ring = "0.17.14"
sha1 = "0.10.7"
sha2 = "0.11.1"
tokio = "1.53.3"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# tc-server: the access token and the names of uploads. tc-store: random installation secrets,
# devices, batches and temp names; the heads files; the machine id of a device's fingerprint;
# the filesystem of a project folder; and the no-replace rename of a staging folder
# (docs/STORAGE.md §17).
getrandom = "0.3.4"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
machine-uid = "0.6.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
rustix = { version = "1.1.5", features = ["fs"] }
# Local git (docs/STORAGE.md §9): libgit2 1.9.7 built from source, without TLS. Only
# tc-door43, which sends sync's fetch and push, adds `features = ["https"]`.
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
# tc-store: the file watcher of docs/STORAGE.md §11.1 (inotify, FSEvents, ReadDirectoryChangesW).
notify = "8.2.0"

# Full debug info made each agent worktree's target dir several GB and filled the disk.
[profile.dev]
debug = "line-tables-only"

# The journal hashes every pack and line; unoptimized SHA-256 made its 64 MiB tests take
# minutes.
[profile.dev.package.sha2]
opt-level = 3

# Every `cargo test` generates the Psalms corpus and one ten times larger, and folds both,
# for the operation-count tests of docs/PERFORMANCE.md rule 2: about half a million changes.
# Unoptimized, that alone took minutes.
[profile.dev.package.tc-journal]
opt-level = 2

[profile.dev.package.tc-corpus]
opt-level = 2

[profile.dev.package.tc-usfm]
opt-level = 2

# The corpora commit hundreds of megabytes in tests; libgit2's C code and its zlib are not
# built at -O0.
[profile.dev.package.libgit2-sys]
opt-level = 3

[profile.dev.package.libz-sys]
# The parity gate (crates/tc-ui/tests/screen_record.rs) decodes and encodes 1280x800
# screenshots wherever a planted or real capture differs from tC4's. Unoptimized, the planted
# pixel test took 3.1 s (whole file 3.8-4.0 s, load 3.5-4.4); optimized, 0.96 s (1.26-1.34 s,
# load 4.9).
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3
