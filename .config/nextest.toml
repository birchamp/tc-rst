# The gate's Rust tests run through cargo-nextest (scripts/gates.sh, CHK-8): a test still running
# after 60 s is named SLOW in the log, and after 5 periods it is stopped and named TIMEOUT, so a
# hung test costs 5 minutes, not the job's whole limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# Longer limits only for tests whose measured time needs one (CHK-8: a local run at 4 threads,
# and CI's libtest times). Each still stops, and SLOW names it every minute.

# tc-api's two round-trip property tests: 210 s and past 300 s locally; their binary took 502 s
# on CI (run 40356855830).
[[profile.default.overrides]]
filter = 'binary_id(tc-api::roundtrip)'
slow-timeout = { period = "60s", terminate-after = 15 }

# tc-store's op-count tests build the Psalms corpus (and its 10x) in each test's process, where
# libtest built it once per binary: 132 to 281 s each locally.
[[profile.default.overrides]]
filter = 'binary_id(tc-store::store) & test(/^(opcount|groups|outside|checkpoint|commands)::/)'
slow-timeout = { period = "60s", terminate-after = 10 }

# A crash at every write of a scenario project: 277 s locally.
[[profile.default.overrides]]
filter = 'binary_id(tc-app::app) & test(=app::store_scenario::a_crash_while_a_scenario_project_is_written_leaves_no_half_project)'
slow-timeout = { period = "60s", terminate-after = 10 }

# tc-app's op-count tests of alignment and checks build the Psalms corpora and their 10x in each
# test's process (7.1 GB peak, where libtest shared one build): more than two at once passed the
# 22 GB a local run may use, and a CI runner has 16 GB. Each took 250 to 265 s locally.
[test-groups]
op-count-corpora = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary_id(tc-app::op_counts) & test(/^op_counts::(align|check)::/)'
test-group = 'op-count-corpora'
slow-timeout = { period = "60s", terminate-after = 10 }
