# A throwaway stand-in for `tc4 serve`, used only by the Electronite spike G0
# (docs/APP-DESIGN.md §10). It is never shipped and is not a member of the
# rebuild's workspace: the empty [workspace] table below makes this directory
# its own workspace, and the root Cargo.toml excludes `spikes`.
[package]
name = "tc4-standin"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "=0.22.1"
crc32fast = "=1.5.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
debug = "line-tables-only"
