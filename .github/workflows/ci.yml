name: ci
permissions:
  contents: read
on:
  push:
  pull_request:
  # The Windows test run, once a night; workflow_dispatch lets anyone run it on a branch.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
concurrency:
  # The event name too, so a nightly or dispatched run never cancels a push run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  lint-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The server and the program without test hooks, as a release builds them; the workspace
      # build always has them through the dev-dependencies.
      - run: cargo clippy --locked -p tc-server -p tc4 --lib --bins -- -D warnings
      # tc-app's library without test hooks, as a release build has it; every other build
      # has them through the self dev-dependency.
      - run: cargo clippy --locked -p tc-app --lib -- -D warnings

  lint-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # Windows code, and a helper only Unix tests call, builds only for a Windows target. A
      # check never links, but ring's and aws-lc's build scripts compile C, so they need MinGW's
      # compiler, and aws-lc's Windows assembly needs NASM.
      - name: clippy for Windows (x86_64-pc-windows-gnu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nasm
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  lint-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # tc-ui's components compile for wasm32 only, so the host jobs never see them.
      - run: cargo clippy --locked -p tc-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy --locked -p tc-ui --target wasm32-unknown-unknown --all-targets --features gallery -- -D warnings
      - run: cargo clippy --locked -p tc-ui --target wasm32-unknown-unknown --all-targets --features app -- -D warnings
      # The no-loss probe page (unit A4b), which only the browser tests build.
      - run: cargo clippy --locked -p tc-ui --target wasm32-unknown-unknown --all-targets --features test-hooks -- -D warnings
      # tc-api's types are the UI's too, so they must build for wasm32 as well.
      - run: cargo clippy --locked -p tc-api --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The old single job took 26 min; the test binaries sum to about 15 min locally.
    timeout-minutes: 75
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # The Windows tests, nightly or on request, until CHK-5 makes them a push gate.
  nightly-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # The tC4 visual-parity baseline: its screenshots (by sha256), DOM snapshots, manifest, README
  # and the owner's rulings in docs/PLAN.md must agree, the mock server must answer the sync
  # transport as the platform does, the parity state built from this repository's copies of
  # tC4's fixtures must equal the one recorded from tC4, and the capture's request tracking and
  # settle must hold, as must the pure parts of the Rust environment (its browser tests skip
  # here: they need tc4 and Playwright), and the tC4 view-state gallery's record must agree with
  # itself (its states, calibration, cases and their files; its browser tests skip here: they
  # need a tC4 clone and Playwright), and every journey file of parity/app/journeys loads (a glob,
  # so a new file cannot be left out; their browser tests skip here too). Node built-ins only, so
  # no install step.
  parity-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test parity/tc4-baseline/baseline.test.mjs parity/tc4-baseline/mock-server/server.test.mjs parity/app/state.test.mjs parity/app/observe.test.mjs parity/app/env-rust.test.mjs parity/view-gallery/view-gallery.test.mjs crates/tc-ui/app/recovery.test.mjs parity/app/journeys/*.test.mjs
