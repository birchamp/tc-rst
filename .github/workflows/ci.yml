name: ci
permissions:
  contents: read
on:
  # Main and gate/* only: a branch with a pull request gets its run from pull_request, and a push
  # there too ran every lint twice.
  push:
    branches: [main, 'gate/**']
  # A pull request runs the lints only: the full tests run where they gate a merge (main, gate/*,
  # the merge queue).
  pull_request:
  # The Windows test run, once a night; workflow_dispatch lets anyone run it on a branch.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  merge_group:
concurrency:
  # The event name too, so a nightly or dispatched run never cancels a push run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a track branch cancels the run it supersedes, which frees runners. Main's
  # runs always finish (a quick follow-up must not cancel the test of the one before), and so
  # do gate/* runs.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/heads/gate/') }}
jobs:
  # What this run must check. `code`: false when the change is wholly prose (docs/ outside
  # docs/contracts/, top-level *.md; scripts/ci-changes.sh), which the node step still checks.
  # `tested`: true on a push to main that the merge queue already tested (the same commit, in a
  # merge_group run of this workflow that passed); an admin merge has no such run, so its push
  # still runs everything. A skipped job reports success, so required checks still pass.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-changes.sh
          sparse-checkout-cone-mode: false
      - id: changes
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci-changes.sh
      - id: tested
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&event=merge_group&status=success" \
            --jq '[.workflow_runs[] | select(.name == "${{ github.workflow }}")] | length')
          echo "tested=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule') && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates.sh --step fmt
      - run: scripts/gates.sh --step clippy
      # The server and the program without test hooks, as a release builds them; the workspace
      # build always has them through the dev-dependencies.
      - run: scripts/gates.sh --step clippy-release-bins
      # tc-app's library without test hooks, as a release build has it; every other build
      # has them through the self dev-dependency.
      - run: scripts/gates.sh --step clippy-release-app
      # The architecture rules take seconds. Run only in the merge queue's test job, each failure
      # cost a 35-minute round trip (pull request 857, three times).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - run: scripts/gates.sh --step arch

  lint-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule') && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # Windows code, and a helper only Unix tests call, builds only for a Windows target. A
      # check never links, but ring's and aws-lc's build scripts compile C, so they need MinGW's
      # compiler, and aws-lc's Windows assembly needs NASM.
      - name: clippy for Windows (x86_64-pc-windows-gnu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nasm
          rustup target add x86_64-pc-windows-gnu
          scripts/gates.sh --step clippy-windows

  lint-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule') && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # tc-ui's components compile for wasm32 only, so the host jobs never see them.
      - run: scripts/gates.sh --step wasm-ui
      - run: scripts/gates.sh --step wasm-ui-gallery
      - run: scripts/gates.sh --step wasm-ui-app
      # The no-loss probe page (unit A4b), which only the browser tests build.
      - run: scripts/gates.sh --step wasm-ui-hooks
      # tc-api's types are the UI's too, so they must build for wasm32 as well.
      - run: scripts/gates.sh --step wasm-api

  test:
    runs-on: ubuntu-latest
    # The scale tests run at twice Psalms (CHK-7c); ten times runs at night.
    timeout-minutes: 75
    needs: plan
    # Full tests run where they gate a merge: main, gate/* and on request (rulings/2026-10-24-test-process.md).
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/gate/') || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')) && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    # actions: write, so a dropped merge group can cancel its own run (first step).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The merge queue deletes a group's branch when it drops the group (a merge ahead of it
      # failed, or main moved), but leaves the group's runs going. A job that only got a runner
      # after that cancels its run instead of spending half an hour on a commit nothing will use.
      - if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null && exit 0
          echo "::notice::The merge queue dropped this group; cancelling the run."
          gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
          sleep 300
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # The test steps run through cargo-nextest (CHK-8), pinned as the Windows VM pins it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - run: scripts/gates.sh --step test
      # Each test step runs even when one before it failed, so one failure hides no other.
      - if: ${{ !cancelled() }}
        run: scripts/gates.sh --step test-doc
      - if: ${{ !cancelled() }}
        run: scripts/gates.sh --step ignored

  test-app:
    runs-on: ubuntu-latest
    # tc-app's tests, on their own runner: with the rest they ran past 75 min (batch 7).
    timeout-minutes: 75
    needs: plan
    # Full tests run where they gate a merge: main, gate/* and on request (rulings/2026-10-24-test-process.md).
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/gate/') || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')) && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    # actions: write, so a dropped merge group can cancel its own run (first step).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      # The merge queue deletes a group's branch when it drops the group (a merge ahead of it
      # failed, or main moved), but leaves the group's runs going. A job that only got a runner
      # after that cancels its run instead of spending half an hour on a commit nothing will use.
      - if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code origin "$GITHUB_REF" > /dev/null && exit 0
          echo "::notice::The merge queue dropped this group; cancelling the run."
          gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
          sleep 300
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # The test steps run through cargo-nextest (CHK-8), pinned as the Windows VM pins it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - run: scripts/gates.sh --step test-app

  # The Windows tests, nightly or on request, until CHK-5 makes them a push gate.
  nightly-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A scheduled failure opens an issue (rulings/2026-10-24-test-process.md).
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # The test steps run through cargo-nextest (CHK-8), pinned as the Windows VM pins it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - run: scripts/gates.sh --step test 2>&1 | tee nightly.log
      - if: ${{ !cancelled() }}
        run: scripts/gates.sh --step test-doc 2>&1 | tee -a nightly.log
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/nightly-issue.sh nightly-windows nightly.log

  # The long variant of the project store's model-based property test (docs/STORAGE.md §16.1):
  # 5,000 random histories of saves, kills, damaged journal files, held files and outside
  # edits; it fails when a reachable row of the ledger's table (§6.2) was never taken.
  store-model-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A scheduled failure opens an issue (rulings/2026-10-24-test-process.md).
    permissions:
      contents: read
      issues: write
    # bash -eo pipefail, so the tee keeps the test's failure.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gates.sh --step model-long 2>&1 | tee nightly.log
      - run: scripts/gates.sh --step scale-long 2>&1 | tee -a nightly.log
      - run: scripts/gates.sh --step sync-model-long 2>&1 | tee -a nightly.log
      - run: scripts/gates.sh --step roundtrip-long 2>&1 | tee -a nightly.log
      - run: scripts/gates.sh --step store-nightly 2>&1 | tee -a nightly.log
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/nightly-issue.sh store-model-nightly nightly.log

  alignment-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: plan
    # Full tests run where they gate a merge: main, gate/* and on request (rulings/2026-10-24-test-process.md).
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/gate/') || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')) && needs.plan.outputs.tested != 'true' && needs.plan.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names: the one pin.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      # The test steps run through cargo-nextest (CHK-8), pinned as the Windows VM pins it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - run: scripts/gates.sh --step alignment-budget

  # The Node checks (gates.sh --step node): the mock server answers the sync transport as the
  # platform does, the parity state built from this repository's copies of tC4's fixtures equals
  # the one recorded from tC4, the page observer's request tracking and settle hold, the pure
  # parts of the Rust environment hold (its browser tests skip
  # here: they need tc4 and Playwright), every journey file of parity/app/journeys loads (a glob,
  # so a new file cannot be left out; their browser tests skip here too), and the documents and
  # tools checks of scripts/tools pass. Node built-ins only, so no install step. The job keeps its
  # name because it is a required check; the screenshot comparison it once ran is retired
  # (docs/rulings/2026-10-29-tc4-is-history.md).
  parity-baseline:
    runs-on: ubuntu-latest
    needs: plan
    # Full tests run where they gate a merge: main, gate/* and on request (rulings/2026-10-24-test-process.md).
    # !cancelled(): if plan fails, its outputs are empty and nothing is skipped.
    if: ${{ !cancelled() && (github.event_name != 'schedule' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/gate/') || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')) && needs.plan.outputs.tested != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/gates.sh --step node
