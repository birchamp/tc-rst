name: ci
permissions:
  contents: read
on:
  push:
  pull_request:
  # The long property tests, nightly.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # tc-ui's components compile for wasm32 only, so the host steps above never see them.
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features gallery -- -D warnings

  # The tC4 visual-parity baseline: its screenshots, manifest, README and the owner's rulings in
  # docs/PLAN.md must agree, and the mock server must answer the sync transport as the platform
  # does. Node built-ins only, so no install step.
  parity-baseline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test parity/tc4-baseline/baseline.test.mjs parity/tc4-baseline/mock-server/server.test.mjs

  # The long variant of the project store's model-based property test (docs/STORAGE.md §16.1):
  # 5,000 random histories of saves, kills, damaged journal files and outside edits checked
  # against the no-loss invariant. `cargo test` runs 200 of them on every push.
  store-model-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tc-store --test store model::random_histories_lose_no_work_long -- --ignored --exact
