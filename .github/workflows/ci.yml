name: ci
permissions:
  contents: read
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The server and the program without test hooks, as a release builds them; the workspace
      # build always has them through the dev-dependencies.
      - run: cargo clippy -p tc-server -p tc4 --lib --bins -- -D warnings
      # tc-app's library without test hooks, as a release build has it; every other build
      # has them through the self dev-dependency.
      - run: cargo clippy -p tc-app --lib -- -D warnings
      # Windows code, and a helper only Unix tests call, builds only for a Windows target. A
      # check never links, but ring's and aws-lc's build scripts compile C, so they need MinGW's
      # compiler, and aws-lc's Windows assembly needs NASM.
      - name: clippy for Windows (x86_64-pc-windows-gnu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 nasm
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo test --workspace
      # tc-ui's components compile for wasm32 only, so the host steps above never see them.
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features gallery -- -D warnings
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features app -- -D warnings
      # The no-loss probe page (unit A4b), which only the browser tests build.
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features test-hooks -- -D warnings
      # tc-api's types are the UI's too, so they must build for wasm32 as well.
      - run: cargo clippy -p tc-api --target wasm32-unknown-unknown --all-targets -- -D warnings

  # The tC4 visual-parity baseline: its screenshots (by sha256), DOM snapshots, manifest, README
  # and the owner's rulings in docs/PLAN.md must agree, the mock server must answer the sync
  # transport as the platform does, the parity state built from this repository's copies of
  # tC4's fixtures must equal the one recorded from tC4, and the capture's request tracking and
  # settle must hold, as must the pure parts of the Rust environment (its browser tests skip
  # here: they need tc4 and Playwright), and the tC4 view-state gallery's record must agree with
  # itself (its states, calibration, cases and their files; its browser tests skip here: they
  # need a tC4 clone and Playwright), and every journey file of parity/app/journeys loads (a glob,
  # so a new file cannot be left out; their browser tests skip here too). Node built-ins only, so
  # no install step.
  parity-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test parity/tc4-baseline/baseline.test.mjs parity/tc4-baseline/mock-server/server.test.mjs parity/app/state.test.mjs parity/app/observe.test.mjs parity/app/env-rust.test.mjs parity/view-gallery/view-gallery.test.mjs crates/tc-ui/app/recovery.test.mjs parity/app/journeys/*.test.mjs
