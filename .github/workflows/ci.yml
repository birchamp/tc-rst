name: ci
permissions:
  contents: read
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The server and the program without test hooks, as a release builds them; the workspace
      # build always has them through the dev-dependencies.
      - run: cargo clippy -p tc-server -p tc4 --lib --bins -- -D warnings
      # tc-app's library without test hooks, as a release build has it; every other build
      # has them through the self dev-dependency.
      - run: cargo clippy -p tc-app --lib -- -D warnings
      # tc-store's library and the performance report without the test holds, as perfreport
      # (docs/PERFORMANCE.md rule 5) builds the store.
      - run: cargo clippy -p tc-store --lib -- -D warnings
      - run: cargo clippy -p tc-corpus --example perfreport -- -D warnings
      - run: cargo test --workspace
      # tc-ui's components compile for wasm32 only, so the host steps above never see them.
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features gallery -- -D warnings
      - run: cargo clippy -p tc-ui --target wasm32-unknown-unknown --all-targets --features app -- -D warnings
      # tc-api's types are the UI's too, so they must build for wasm32 as well.
      - run: cargo clippy -p tc-api --target wasm32-unknown-unknown --all-targets -- -D warnings

  # docs/PERFORMANCE.md rule 5: the release benchmarks of every budget that tc-journal, tc-store,
  # tc-check, tc-align and tc-resources own, on the whole-Bible corpus (`perfreport ci`). A row
  # fails only above three times its budget, because CI machines vary; the verdicts against the
  # reference laptop come from `perfreport run --ratios` (docs/evidence/storage-scale-*). The
  # report is built alone (-p tc-corpus), so the store has no test holds.
  perf:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tc-corpus --example perfreport
      - run: target/release/examples/perfreport ci "$RUNNER_TEMP/perf" --tolerance 3

  # The tC4 visual-parity baseline: its screenshots (by sha256), DOM snapshots, manifest, README
  # and the owner's rulings in docs/PLAN.md must agree, the mock server must answer the sync
  # transport as the platform does, the parity state built from this repository's copies of
  # tC4's fixtures must equal the one recorded from tC4, and the capture's request tracking and
  # settle must hold, as must the pure parts of the Rust environment (its browser tests skip
  # here: they need tc4 and Playwright). Node built-ins only, so no install step.
  parity-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test parity/tc4-baseline/baseline.test.mjs parity/tc4-baseline/mock-server/server.test.mjs parity/app/state.test.mjs parity/app/observe.test.mjs parity/app/env-rust.test.mjs
