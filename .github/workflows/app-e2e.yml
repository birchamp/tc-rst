# Every browser journey in parity/app/journeys/ against a real tc4, the real UI builds, the fake
# Door43 and Chromium (card G5). A skipped journey fails the job: kit.mjs skips when a build is
# missing, and that must never read as green. Pixels are not compared here: a pixel baseline
# gates only on the machine that captured it (docs/APP-DESIGN.md §7.9).
name: app-e2e
permissions:
  contents: read
on:
  # The journeys gate a merge: they run on main, gate/* and in the merge queue (and on request),
  # not on every track push (rulings/2026-10-24-test-process.md). Main is
  # claude/focused-ride-5uzj7p until the move to unfoldingWord/translationCore4.
  push:
    branches: [main, claude/focused-ride-5uzj7p, 'gate/**']
  # A pull request only reports the job as skipped: journeys is a required check, and a check
  # that never reports would keep the pull request out of the merge queue.
  pull_request:
  workflow_dispatch:
  merge_group:
concurrency:
  # The event name too, so a dispatched run never cancels a push run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a track branch cancels the run it supersedes, which frees runners. Main's
  # runs always finish (a quick follow-up must not cancel the test of the one before), and so
  # do gate/* runs.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/heads/gate/') }}
jobs:
  # Whether the change can affect this workflow's tests: false when it is wholly prose
  # (scripts/ci-changes.sh). A skipped job reports success, so required checks still pass.
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-changes.sh
          sparse-checkout-cone-mode: false
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
        run: scripts/ci-changes.sh

  journeys:
    needs: changes
    # !cancelled(): if changes fails, its output is empty and nothing is skipped.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names, wasm32 included.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - id: bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: parity/tc4-baseline
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      # --with-deps also installs Chromium's system libraries, which the cache does not hold.
      - run: npx playwright install --with-deps chromium
        working-directory: parity/tc4-baseline
      # The one gate list's journeys step (scripts/gates.sh): the builds, every journey, and
      # no-skips.mjs. A journey that leaves a browser or a tc4 running keeps node from ending
      # (run 39956490017 hung 38 minutes); builds and journeys take about 10 minutes cold.
      - name: journeys
        timeout-minutes: 25
        run: scripts/gates.sh --step journeys
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-tap
          path: target/app-e2e.tap
