# Every browser journey in parity/app/journeys/ against a real tc4, the real UI builds, the fake
# Door43 and Chromium (card G5). A skipped journey fails the job: kit.mjs skips when a build is
# missing, and that must never read as green. Pixels are not compared here: a pixel baseline
# gates only on the machine that captured it (docs/APP-DESIGN.md §7.9).
name: app-e2e
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  # The event name too, so a dispatched run never cancels a push run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a track branch cancels the run it supersedes, which frees runners. Main's
  # runs always finish (a quick follow-up must not cancel the test of the one before), and so
  # do gate/* runs, which are a merge's receipt (scripts/gates.sh --wait-ci).
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/focused-ride-5uzj7p' && !startsWith(github.ref, 'refs/heads/gate/') }}
jobs:
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      # The runner image leaves too little disk for this workspace ("No space left on device",
      # runs 39305042134 and 39317068070); these three trees are not needed here.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      # With no name, rustup installs the toolchain rust-toolchain.toml names, wasm32 included.
      - run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - id: bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: parity/tc4-baseline
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      # --with-deps also installs Chromium's system libraries, which the cache does not hold.
      - run: npx playwright install --with-deps chromium
        working-directory: parity/tc4-baseline
      # The one gate list's journeys step (scripts/gates.sh): the builds, every journey, and
      # no-skips.mjs. A journey that leaves a browser or a tc4 running keeps node from ending
      # (run 39956490017 hung 38 minutes); builds and journeys take about 10 minutes cold.
      - name: journeys
        timeout-minutes: 25
        run: scripts/gates.sh --step journeys
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-tap
          path: target/app-e2e.tap
