[package]
name = "tc-door43"
description = "Door43 (Gitea/DCS) HTTP client and the app's session internet switch."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tc-core = { path = "../tc-core" }
base64.workspace = true
httpdate = "1.0.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
md-5.workspace = true
reqwest = { workspace = true, features = ["rustls", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
# Already built for reqwest: the download's stop checks wait with `time`, and its zip is
# checked on the blocking pool (`rt`).
tokio = { workspace = true, features = ["rt", "time"] }
tracing = "0.1.44"
url.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
tc-door43-fake = { path = "../tc-door43-fake" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process"] }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
