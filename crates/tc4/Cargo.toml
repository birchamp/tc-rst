[package]
name = "tc4"
description = "The tC4 rebuild's program: `tc4 serve` takes the app-data lock, starts the local server and prints its address."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tc4"
path = "src/main.rs"

[features]
# `tc4 serve --test-hooks` and the `test` service (AD35). A release build has neither.
test-hooks = ["tc-app/test-hooks", "tc-server/test-hooks", "tc-api/test-hooks"]

[dependencies]
tc-api = { path = "../tc-api" }
tc-app = { path = "../tc-app" }
tc-door43 = { path = "../tc-door43" }
tc-server = { path = "../tc-server" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util"] }

[dev-dependencies]
# Test builds carry the hooks, so the process tests can crash the real binary.
tc4 = { path = ".", features = ["test-hooks"] }
# The HTTP client of tc-server's tests, which these tests share.
percent-encoding.workspace = true
tempfile.workspace = true

[lints]
workspace = true
