[package]
name = "tc-door43-fake"
description = "A fake Door43 (Gitea/DCS) server for tests: the swagger's shapes over fixture data, and git smart HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
base64.workspace = true
futures-util = { version = "0.3.34", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "process", "io-util", "sync", "time", "macros"] }
zip.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
