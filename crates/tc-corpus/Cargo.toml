[package]
name = "tc-corpus"
description = "The deterministic scale corpus of docs/PERFORMANCE.md: real Psalms data and a whole Bible generated from it, as journal changes and as plain domain inputs. For tests and benchmarks only."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tc-core = { path = "../tc-core" }
tc-usfm = { path = "../tc-usfm" }
tc-burrito = { path = "../tc-burrito" }
tc-journal = { path = "../tc-journal" }
tc-versification = { path = "../tc-versification" }
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
# shabench compares the two SHA-256 implementations on the corpus.
ring.workspace = true
sha2.workspace = true
# foldbench reads files on the worker pool the fold itself uses, as an open does.
rayon.workspace = true
# perfreport (docs/PERFORMANCE.md rule 5): the budgets of the storage core and of the domain
# crates, measured end to end on this corpus. Not shipped.
tc-store = { path = "../tc-store" }
tc-check = { path = "../tc-check" }
tc-align = { path = "../tc-align" }
tc-resources = { path = "../tc-resources" }
tc-helps = { path = "../tc-helps" }
tempfile.workspace = true
sysinfo.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# posix_fadvise(DONTNEED) and sync: a cold disk cache without privileges.
rustix.workspace = true

[lints]
workspace = true
