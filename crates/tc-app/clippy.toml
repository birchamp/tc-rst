# Clippy reads the clippy.toml nearest the crate, so this file replaces the workspace's: its four
# keys first, as the root's clippy.toml has them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# No read in tc-app may cost the whole project (APP-DESIGN §4.3, §8.1, PERFORMANCE rule 1). These
# are the public reads of `FoldState` that walk every key, change, book, batch or conflict of a
# fold, or project a whole book, whatever they are asked for or only for some of it (`render`
# and the scope digests walk every conflict for `conflicts.json`). `tests/op_counts/lint.rs`
# names every public method of `FoldState` in tc-journal's source, each either in this list or
# with what it costs instead, so a method dropped from here, or a new one, fails a test. The
# counted walks go through `counters::CountingSnapshot`, the one place allowed to call them; the
# seed check of the fixture backend reads a whole fold once when a fixture loads, with an
# `#[expect]` saying so, and the same test fails when any other file of tc-app's library turns
# the lint off. Test crates allow the lint: tests read whole folds to check results.
disallowed-methods = [
  { path = "tc_journal::fold::FoldState::record_keys", reason = "lists and sorts every key of the project; use CountingSnapshot's range reads (APP-DESIGN §4.3)" },
  { path = "tc_journal::fold::FoldState::frontier", reason = "walks every key of the project; tc-app never needs it" },
  { path = "tc_journal::fold::FoldState::device_stats", reason = "walks every change of the project" },
  { path = "tc_journal::fold::FoldState::derived_files", reason = "walks every book of the project; materializing is the store's" },
  { path = "tc_journal::fold::FoldState::batch_changes", reason = "walks every batch of the project" },
  { path = "tc_journal::fold::FoldState::conflicts", reason = "walks the whole conflict list: go through CountingSnapshot::conflicts, which counts it" },
  { path = "tc_journal::fold::FoldState::conflicts_of", reason = "walks the whole conflict list, as conflicts does" },
  { path = "tc_journal::fold::FoldState::unreadable_records", reason = "walks the whole conflict list, as conflicts does; listing unreadable records is the store's" },
  { path = "tc_journal::fold::FoldState::retry_unreadable", reason = "walks the whole conflict list to judge every unreadable record again; the store's" },
  { path = "tc_journal::fold::FoldState::conflicts_rebuilt", reason = "builds every record's conflict again: the store's background check" },
  { path = "tc_journal::fold::FoldState::metadata_source", reason = "projects every book to tell whether the text is NFC; metadata.json is the store's" },
  { path = "tc_journal::fold::FoldState::render_book", reason = "renders every file of a book: go through CountingSnapshot::render_book, which counts it" },
  { path = "tc_journal::fold::FoldState::book_usfm", reason = "projects a whole book: go through CountingSnapshot::book_usfm, which counts it" },
  { path = "tc_journal::fold::FoldState::render", reason = "renders a file: a book's text projects the whole book and conflicts.json walks every conflict; go through CountingSnapshot::render, which counts it" },
  { path = "tc_journal::fold::FoldState::scope_digest", reason = "digests a file's scope, every conflict for conflicts.json: the store's manifest" },
  { path = "tc_journal::fold::FoldState::scope_digests", reason = "digests files' scopes, every conflict for conflicts.json: the store's manifest" },
  # S2's readers of a whole book or file: the store's materialize and its outside-edit work.
  { path = "tc_journal::fold::FoldState::book_parts", reason = "projects a whole book into its parts: the store's compare of a file with its projection" },
  { path = "tc_journal::fold::FoldState::render_book_with_digests", reason = "renders every file of a book with its digests: the store's heads files" },
  { path = "tc_journal::fold::FoldState::render_with_digests", reason = "renders a file with its digests: the store's heads files" },
  { path = "tc_journal::fold::FoldState::carried_versions", reason = "walks every carried version: the store's repack" },
  { path = "tc_journal::fold::FoldState::metadata_heads", reason = "walks every metadata record's heads: the store's heads file" },
  { path = "tc_journal::fold::FoldState::plan_outside_edit", reason = "decodes a whole file against the project: the store's import" },
  { path = "tc_journal::fold::FoldState::plan_update_book", reason = "decodes a whole book file against the project: the store's Update a book" },
  { path = "tc_journal::fold::FoldState::plan_update_book_from", reason = "decodes a whole book file against a kept copy's base: the store's Import" },
  { path = "tc_journal::fold::FoldState::undo_outside", reason = "walks an outside batch's changes: the store's" },
  # The store adapter (unit C0) puts tc-store behind the seam; these three of tc-store's own
  # handle are never called in tc-app.
  { path = "tc_store::handle::ProjectHandle::mint", reason = "mints from the newest snapshot, which lists heads a screen that read an older one never saw (I4): mint from the Snapshot the screen read" },
  { path = "tc_store::handle::ProjectHandle::mint_review", reason = "mints from the newest snapshot (I4): mint from the Snapshot the screen read" },
  { path = "tc_store::handle::ProjectHandle::read_book", reason = "projects a whole book outside CountingSnapshot's counts: go through CountingSnapshot::book_usfm" },
]
