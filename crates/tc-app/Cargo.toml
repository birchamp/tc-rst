[package]
name = "tc-app"
description = "The application services of the tC4 rebuild: the operations behind every screen, background jobs and their progress, events, one-at-a-time flows, this computer's preferences, the operation reports and the reply cache."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The `test` service of APP-DESIGN §5.8 (AD35): test/fieldStore, crash points, holds.
# Release builds never enable it.
test-hooks = ["tc-api/test-hooks"]

[dependencies]
tc-api = { path = "../tc-api", features = ["server"] }
tc-core = { path = "../tc-core" }
tc-door43 = { path = "../tc-door43" }
tc-resources = { path = "../tc-resources" }
base64.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
unicode-normalization.workspace = true

[dev-dependencies]
# The integration tests use the test hooks, as tc-api's own tests enable its features.
tc-app = { path = ".", features = ["test-hooks"] }
tc-api = { path = "../tc-api", features = ["server", "test-hooks", "proptest"] }
proptest.workspace = true
tempfile.workspace = true
# The UI's save machine and draft buffer, played against the real test/fieldStore (A4b). tc-ui's
# host build is its pure modules only.
tc-ui = { path = "../tc-ui" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints]
workspace = true
