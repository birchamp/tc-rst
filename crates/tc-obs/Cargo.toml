[package]
name = "tc-obs"
description = "Open Bible Stories: the story file codec, frames, pictures, the new-project template, progress and the print model."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tc-helps = { path = "../tc-helps" }
serde_json.workspace = true
