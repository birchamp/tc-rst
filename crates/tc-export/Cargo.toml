[package]
name = "tc-export"
description = "The export kernel's pure parts: the print model of a book and of an Open Bible Stories project, with its page setup."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The page setup and the print parts are tc-api's, so the preview and the PDF print from one
# model. Never its `server` feature.
tc-api = { path = "../tc-api" }
tc-obs = { path = "../tc-obs" }
# Aligned USFM: the book as the journal stores it (tc-usfm's codec), the one weave and the
# one review rule (tc-align), and the alignment value (tc-journal).
tc-align = { path = "../tc-align" }
tc-core = { path = "../tc-core" }
tc-journal = { path = "../tc-journal" }
tc-usfm = { path = "../tc-usfm" }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
# The tests build stories with tc-helps' type and read the OBS sample with tc-obs' parser.
tc-helps = { path = "../tc-helps" }
# The benchmark reads the en_obs v9 stories from bundle/en.
zip.workspace = true

[lints]
workspace = true
