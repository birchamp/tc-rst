[package]
name = "tc-api"
description = "The wire types the tC4 rebuild's server and UI share: requests, replies, errors, events and the endpoint list."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Making and reading token texts. Only the server side (tc-app) enables it; tc-ui never does.
# The token types have no other conversion to or from text, so UI code can make, read or
# relabel a token only by re-encoding it through JSON, which the server's MAC refuses (R19).
server = []
# The `test` service, which exists only in test builds of the server (AD35). `test/echo`
# measures the length of a reply with serde_json, so the feature brings it in.
test-hooks = ["dep:serde_json"]
# `proptest::arbitrary::Arbitrary` for every wire type, for property tests here and in the
# crates that use these types.
proptest = ["dep:proptest", "dep:proptest-derive", "tc-core/proptest"]

[dependencies]
tc-core = { path = "../tc-core" }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
# The NFC the draft machine compares texts with (`model::draft`), the crate and version the
# server and the UI normalize with.
unicode-normalization.workspace = true
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }

# proptest does not build for wasm32-unknown-unknown, where clippy --all-targets also runs, so
# the tests that need it run on the host only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tc-api = { path = ".", features = ["server", "test-hooks", "proptest"] }
# A check's place on the wire is the text tc-check prints for its target (tests/check.rs).
tc-check = { path = "../tc-check" }
tc-helps = { path = "../tc-helps" }
# The preview's print parts are tc-export's (tests/print.rs, APP-DESIGN 3.8).
tc-export = { path = "../tc-export" }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
